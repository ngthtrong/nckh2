    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="10" y="416.867344" transform="rotate(-0 10 416.867344)">«include»: từ ca cơ sở tới phần dùng chung; «extend»: từ phần mở rộng về ca được mở rộng (UML 2.5.1 §18.1.4).</text>
