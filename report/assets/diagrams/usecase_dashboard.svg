   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="10" y="404.934141" transform="rotate(-0 10 404.934141)">Bổ sung tọa độ là mở rộng khi cần xác minh vị trí. Phiên đăng nhập là tiền điều kiện của thao tác được bảo vệ.</text>
