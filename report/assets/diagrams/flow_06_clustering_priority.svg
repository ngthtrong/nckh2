    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="20" y="31.430547" transform="rotate(-0 20 31.430547)">1 · CACHE VÀ ĐẦU VÀO</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="264" y="32.424766" transform="rotate(-0 264 32.424766)">2 · ĐỒ THỊ VÀ CỘNG ĐỒNG</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="508" y="32.424766" transform="rotate(-0 508 32.424766)">3 · HỌ BẰNG CHỨNG / ƯU TIÊN</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(79.832812 74.850799)">GET /api/clusters</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(48.208945 85.127795)">Đọc version epoch:cluster_rev</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(57.855898 137.771342)">Không đổi: dùng snapshot</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(56.645391 148.708959)">Chậm: trả stale + tính nền</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(57.61543 159.422955)">If-None-Match khớp → 304</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(82.430469 273.580191)">Đọc active_only</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(60.72 284.121406)">Bỏ resolved và cancelled</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(61.400586 294.398402)">to_report_v2: L,T,F,E,N,V</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="120" y="352.359648" transform="rotate(-0 120 352.359648)">Đủ vị trí và thời gian?</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(306.964375 75.169643)">Thiếu L/T: hàng xem xét</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(298.991797 85.883639)">Không suy tọa độ mặc định</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(306.644492 137.625057)">Đủ: ma trận tương đồng</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(287.910937 148.45001)">Haversine / thời gian / ngữ cảnh</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(303.917695 159.164006)">Product C_ij và độ tin cậy</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(308.975703 210.597787)">Ngưỡng quantile, top-K</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(309.597656 221.806822)">Đối xứng hợp các cạnh</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(302.223281 341.783625)">Louvain: cộng đồng đồ thị</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(304.436484 352.99266)">clusterKey = ID nhỏ nhất</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(282.745312 363.269656)">Khóa có thể đổi khi thành viên đổi</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(556.846953 69.712932)">Nhóm họ bằng chứng</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(555.78043 79.989928)">Fingerprint / envelope</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(540.863945 91.361131)">Q_i và các tổng hợp có chặn</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(562.621172 137.224238)">Tổng hợp Ē, F̄, N̄, V̄</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(534.306719 148.433273)">Ưu tiên có hệ số nhóm yếu thế</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(554.278242 159.970059)">Sắp xếp giảm dần P(c)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(544.40418 273.81591)">Lưu snapshot RAM và ETag</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(558.091602 284.092906)">Trả clusters + review</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(558.769219 294.806902)">computedAt và stale</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(539.574766 347.329213)">Dashboard hỗ trợ quyết định</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(521.02082 358.043209)">Cụm không thay report ID nghiệp vụ</text>
   </g>
