   <g id="text_19">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="10" y="411.002344" transform="rotate(-0 10 411.002344)">P(c) = (wE·Ē + wF·F̄ + wN·N̄) × [1 + (μ−1)tanh(V̄/s)]; không thay bằng tổng tuyến tính bốn đại lượng.</text>
