   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="264" y="32.492781" transform="rotate(-0 264 32.492781)">2 · LƯU VÀ HIỂN THỊ</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="508" y="32.298344" transform="rotate(-0 508 32.298344)">3 · LẶP CÓ ĐIỀU KIỆN</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(68.115156 74.516889)">Mở màn hình theo dõi</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(50.983984 85.725924)">Lấy các report ID cần tra cứu</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="120" y="148.311406" transform="rotate(-0 120 148.311406)">Có mạng?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(52.13957 210.954408)">Không: đọc trạng thái đã lưu</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(50.837773 221.668404)">trong Hive; không tạo ca mới</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(55.953672 279.172908)">Có: GET /api/reports/status</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(77.696797 289.449904)">Gửi danh sách ids</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(297.085117 74.922123)">Ghép kết quả theo report ID</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(301.559023 86.131158)">Chỉ nhận trạng thái đi tiến</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(305.286289 132.426627)">processing: đã tiếp nhận</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(305.26625 143.635662)">dispatched: đã điều phối</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(320.688906 153.912658)">resolved: hoàn tất</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(318.861641 164.626654)">cancelled: đã đóng</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(298.43293 278.954408)">Lưu Hive; cập nhật timeline</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(288.805273 289.668404)">Thông báo trạng thái nghiệp vụ</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(557.632187 74.70893)">Còn ca chưa kết thúc</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(557.228437 85.533883)">và app ở foreground?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(547.657187 211.172908)">Có mạng: đặt lịch tra cứu</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(530.246953 221.449904)">15 s khi theo dõi / mặc định 60 s</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(537.719297 346.841039)">Ca cuối / app ngừng theo dõi:</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(543.489805 358.212242)">dừng hoặc đổi lịch phù hợp</text>
   </g>
