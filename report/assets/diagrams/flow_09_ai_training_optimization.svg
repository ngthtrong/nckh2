   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="264" y="32.424766" transform="rotate(-0 264 32.424766)">2 · HUẤN LUYỆN / VALIDATION</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="508" y="31.843164" transform="rotate(-0 508 31.843164)">3 · TEST / CÁC NHÁNH TỐI ƯU</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(60.298437 75.388143)">1702 ảnh, bốn mức ngập</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(48.453125 85.665139)">Train 1189 / val 257 / test 256</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(51.464922 137.297307)">EXIF → RGB → letterbox 256²</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(49.259883 148.66851)">Bilinear; chuẩn hóa ImageNet</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(64.183789 158.945506)">Train: flip / affine / jitter</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(74.728789 278.764408)">MobileNetV3-Large</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(57.55457 289.478404)">Dropout 0,25; Linear 4 lớp</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(293.545625 74.922123)">Khóa backbone ba epoch đầu</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(284.685391 86.131158)">Features ở eval; huấn luyện head</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(310.906875 137.84441)">Mở backbone, AdamW</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(295.899844 148.121406)">CE smoothing + 0,1 severity</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(315.932969 158.398402)">ReduceLROnPlateau</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(314.205156 205.759689)">Validation mỗi epoch</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(318.69168 217.335736)">Accuracy / lỗi nặng</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(303.257891 227.612732)">Early stopping patience 7</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(288.178867 341.166385)">Chọn checkpoint trên validation</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(291.947695 351.880381)">Ưu tiên accuracy; có tie-break</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(319.600859 363.456428)">bằng tỷ lệ lỗi nặng</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(557.202461 69.166385)">Đánh giá test độc lập</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(537.823203 80.742432)">FP32: accuracy / F1 / lỗi nặng</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(528.171055 91.456428)">Không dùng test chọn checkpoint</text>
