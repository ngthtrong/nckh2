   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(567.368203 138.03441)">Các nhánh riêng:</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(535.499414 148.311406)">PTQ calibration trên train; QAT</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(551.259766 158.588402)">Cắt tỉa kênh có cấu trúc</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(535.567695 272.912371)">Xuất ONNX và ExecuTorch/PTE</text>
