  <line x1="927" y1="110" x2="927" y2="132" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-actor)" marker-end="url(#arrow-actor)" />
  <text x="936" y="124" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="8.5px" fill="#000000">Vận hành Web</text>

  <!-- Bàn điều phối Web GIS Leaflet -->
  <rect x="810" y="132" width="235" height="336" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <rect x="810" y="132" width="235" height="32" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <text x="927" y="153" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#000000">Bàn điều phối Web (Leaflet GIS)</text>

  <!-- Module 1: Bản đồ giám sát -->
  <rect x="821" y="174" width="213" height="64" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="832" y="193" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Bản đồ Giám sát Leaflet GIS</text>
  <text x="832" y="210" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Ranh giới cụm &amp; màu ưu tiên theo P(c)</text>
  <text x="832" y="226" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Chấm gán tọa độ ca thiếu GPS/thời gian</text>

  <!-- Module 2: Quản lý cụm & Ca -->
  <rect x="821" y="248" width="213" height="86" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <text x="832" y="267" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Bảng Cụm &amp; Thẩm tra (Review)</text>
  <text x="832" y="285" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Danh sách xếp hạng ưu tiên giảm dần P(c)</text>
  <text x="832" y="301" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Hàng xem xét (Review Queue) thẩm tra SOS</text>
  <text x="832" y="317" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Khóa clusterKey giữ ổn định hiển thị</text>

  <!-- Module 3: Phân công & Quản trị -->
  <rect x="821" y="344" width="213" height="112" rx="5" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
  <text x="832" y="363" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Phân công Đội &amp; Quản trị</text>
  <text x="832" y="381" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Giao đội cứu trợ &amp; đổi 4 trạng thái ca</text>
  <text x="832" y="397" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Quản lý đội cứu hộ (/api/teams)</text>
  <text x="832" y="413" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Nhật ký kiểm toán ca (report_events)</text>
  <text x="832" y="429" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Quản lý tài khoản điều phối &amp; sao lưu DB</text>


