<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500">
  <defs>
    <style>
      .sectitle { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 12.5px; font-weight: bold; }
      .boxbold { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 11.5px; font-weight: bold; }
      .boxsub { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 10px; fill: #000000; }
      .actorbold { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 11.5px; font-weight: bold; fill: #000000; }
      .actorsub { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 10.5px; fill: #000000; }
      .lblbold { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 9.5px; font-weight: bold; }
      .lblsub { font-family: 'Roboto', 'DejaVu Sans', 'Arial', sans-serif; font-size: 8.5px; fill: #000000; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-actor" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="1080" height="500" fill="#ffffff" />

  <!-- ==================== CỘT 1: PHÂN HỆ DI ĐỘNG BIÊN (TRÁI) ==================== -->
  <rect x="20" y="16" width="275" height="468" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <rect x="20" y="16" width="275" height="32" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
  <text x="157" y="37" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#000000">PHÂN HỆ DI ĐỘNG BIÊN (EDGE)</text>

  <!-- Actor Mobile -->
  <rect x="36" y="58" width="242" height="52" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2" />
  <text x="157" y="79" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="11px" font-weight="bold" fill="#000000">Người dân / Nạn nhân</text>
  <text x="157" y="97" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">&amp; Đội cứu hộ thực địa</text>

  <!-- Mũi tên Actor <-> Flutter Client -->
  <line x1="157" y1="110" x2="157" y2="132" stroke="#000000" stroke-width="1.5" marker-start="url(#arrow-actor)" marker-end="url(#arrow-actor)" />
  <text x="166" y="124" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="8.5px" fill="#000000">Tương tác App</text>

  <!-- Ứng dụng Di động Flutter -->
  <rect x="36" y="132" width="242" height="336" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <rect x="36" y="132" width="242" height="32" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <text x="157" y="153" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="11.5px" font-weight="bold" fill="#000000">Ứng dụng Di động (Flutter Client)</text>

  <!-- Module 1: SOS & Báo cứu nạn -->
  <rect x="47" y="174" width="220" height="64" rx="5" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
  <text x="58" y="193" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">SOS Khẩn cấp &amp; Báo cáo</text>
  <text x="58" y="210" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• SOS 1 chạm gửi tọa độ GPS tức thời</text>
  <text x="58" y="226" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Báo ngập đa phương thức (Ảnh, N, V)</text>

  <!-- Module 2: Edge AI -->
  <rect x="47" y="248" width="220" height="86" rx="5" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
  <text x="58" y="267" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Suy luận On-device Edge AI</text>
  <text x="58" y="285" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Phân loại mức ngập F (MobileNetV3)</text>
  <text x="58" y="301" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Runtime: ExecuTorch (chính), ONNX</text>
  <text x="58" y="317" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Tính điểm khẩn cấp biên E_i</text>

  <!-- Module 3: Outbox & Sync -->
  <rect x="47" y="344" width="220" height="112" rx="5" fill="#ffffff" stroke="#ffffff" stroke-width="1" />
  <text x="58" y="363" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Hive Outbox &amp; Ngoại tuyến</text>
  <text x="58" y="381" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Store-and-Forward chống mất tin</text>
  <text x="58" y="397" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Chuẩn hóa băm JCS (RFC 8785)</text>
  <text x="58" y="413" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Tra cứu tiến độ ca (/reports/status)</text>
  <text x="58" y="429" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Tiếp nhận nhiệm vụ cứu hộ thực địa</text>


  <!-- ==================== CỘT 2: MÁY CHỦ XỬ LÝ TRUNG TÂM (GIỮA) ==================== -->
  <rect x="415" y="16" width="290" height="468" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6" stroke-dasharray="6,4" />
  <rect x="415" y="16" width="290" height="32" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.6" />
  <text x="560" y="37" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="12px" font-weight="bold" fill="#000000">MÁY CHỦ XỬ LÝ TRUNG TÂM (BACKEND CORE)</text>

  <!-- Box 1: FastAPI Ingestion & Service -->
  <rect x="428" y="58" width="264" height="110" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <rect x="428" y="58" width="264" height="26" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <text x="560" y="75" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Cổng Tiếp nhận &amp; REST API (FastAPI)</text>
  <text x="439" y="99" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Hợp đồng JCS (RFC 8785) &amp; Header v1</text>
  <text x="439" y="115" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Chống trùng lặp Idempotency (messages_dedup)</text>
  <text x="439" y="131" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Tiếp nhận SMS Webhook (/api/sms/inbound)</text>
  <text x="439" y="147" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Xác thực phiên &amp; REST API cho Mobile, Web</text>

  <!-- Mũi tên Gateway <-> Storage (Ghi nhận tức thời) -->
  <line x1="560" y1="168" x2="560" y2="198" stroke="#000000" stroke-width="1.6" marker-start="url(#arrow-teal)" marker-end="url(#arrow-teal)" />
  <rect x="475" y="175" width="170" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8" />
  <text x="560" y="187" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="8.5px" font-weight="bold" fill="#000000">Ghi nhận tức thời &amp; Đọc ca (SQLite WAL)</text>

  <!-- Box 2: Lưu trữ Bền vững -->
  <rect x="428" y="198" width="264" height="96" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <rect x="428" y="198" width="264" height="26" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <text x="560" y="215" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Kho Lưu trữ Bền vững (SQLite &amp; Files)</text>
  <text x="439" y="239" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• CSDL SQLite WAL (reports, teams, meta)</text>
  <text x="439" y="255" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Nhật ký kiểm toán phân công report_events</text>
  <text x="439" y="271" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Thư mục lưu trữ ảnh hiện trường (uploads/)</text>

  <!-- Mũi tên Storage <-> rescue_core -->
  <line x1="560" y1="294" x2="560" y2="324" stroke="#000000" stroke-width="1.6" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)" />
  <rect x="472" y="301" width="176" height="16" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="0.8" />
  <text x="560" y="313" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="8.5px" font-weight="bold" fill="#000000">Đọc active reports ↔ Cache RAM (ETag)</text>

  <!-- Box 3: Lõi thuật toán rescue_core & ClusterService -->
  <rect x="428" y="324" width="264" height="144" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <rect x="428" y="324" width="264" height="26" rx="7" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <text x="560" y="341" text-anchor="middle" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="10.5px" font-weight="bold" fill="#000000">Lõi Thuật toán &amp; Phân cụm (rescue_core)</text>
  <text x="439" y="365" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Ma trận đồ thị C_ij &amp; Phân cụm Louvain đa tỉ lệ</text>
  <text x="439" y="381" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Điểm ưu tiên cụm P(c) đa tiêu chí (E, F, N, V)</text>
  <text x="439" y="397" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Khóa clusterKey duy trì lựa chọn khi tải</text>
  <text x="439" y="413" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Hàng xem xét (Review Queue) thiếu GPS/giờ</text>
  <text x="439" y="429" font-family="Roboto, DejaVu Sans, Arial, sans-serif" font-size="9.5px" fill="#000000">• Bộ nhớ đệm phân cụm trên RAM (ETag)</text>


  <!-- ==================== CỘT 3: BÀN ĐIỀU PHỐI WEB GIS (PHẢI) ==================== -->
  <rect x="795" y="16" width="265" height="468" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
