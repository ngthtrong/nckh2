   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(10 605.878617)">HTTP chưa ACK: giữ Outbox để thử lại. SMS chỉ được thử khi đủ điều kiện.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(10 617.989664)">Tác nghiệp thực địa nằm ngoài phần mềm; ACK không xác nhận ca đã được cứu.</text>
