   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(72.155547 66.301457)">SOS một chạm</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(50.379766 79.08534)">Không bắt buộc ảnh / AI</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(309.557617 65.520305)">Báo cáo chi tiết</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(299.978203 79.722508)">Ảnh / AI là tùy chọn</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(176.961719 135.703797)">Lưu cục bộ + Outbox</text>
