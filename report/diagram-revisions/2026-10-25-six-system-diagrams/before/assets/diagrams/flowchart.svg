   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(55.624063 241.301402)">Tiếp nhận HTTP / SMS</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(49.630156 253.898105)">Kiểm tra theo từng kênh</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(44.79332 265.751879)">Lưu mới hoặc gộp báo cáo</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(298.060391 241.22607)">Đủ vị trí + thời gian:</text>
