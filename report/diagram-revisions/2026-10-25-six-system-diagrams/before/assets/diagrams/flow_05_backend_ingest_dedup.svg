   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203b50" x="10" y="14.68125" transform="rotate(-0 10 14.68125)">A · REQUEST /sync/messages</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(76.464219 50.853348)">Kiểm tra header v1, JSON</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(53.633789 63.26673)">số message và dung lượng request</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(117.705352 116.69452)">Request</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(119.794609 128.548293)">hợp lệ?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(317.751289 107.239227)">HTTP 400: version,</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(303.450078 118.664609)">JSON hoặc &gt;50 message</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(314.408477 130.024383)">HTTP 413: &gt;256 KiB</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(323.21082 142.003586)">Dừng cả request</text>
   </g>
   <g id="text_5">
    <g id="patch_30">
     <path d="M 238.565 112.705156
L 269.435 112.705156
L 269.435 101.294844
L 238.565 101.294844
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203b50" x="254" y="109.663437" transform="rotate(-0 254 109.663437)">Không</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(285 169.80941)">B · TỪNG MESSAGE</text>
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(285 181.169184)">ACK theo message_id</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(50.132148 198.21057)">Kiểm tra cấu trúc, hash và hạn dùng</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(52.186523 209.570344)">JCS (RFC 8785) → SHA-256; so hash</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(61.003711 221.983727)">Sai payload / hash / TTL: từ chối</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(343.076953 224.94152)">rejected</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(306.749844 236.301293)">Payload / hash / TTL sai</text>
   </g>
   <g id="text_9">
    <g id="patch_31">
     <path d="M 143.934297 168.525156
L 158.065703 168.525156
L 158.065703 157.474844
L 143.934297 157.474844
