" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203b50" x="151" y="165.483437" transform="rotate(-0 151 165.483437)">Có</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(104.431328 278.94152)">ID / sequence</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(121.524648 290.301293)">đã có?</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(323.573008 291.263695)">Cùng ID + hash:</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(308.398984 303.677078)">duplicate + kết quả cũ</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(302.140859 315.530852)">Khác hash / tái dùng seq:</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(321.484492 328.359117)">rejected + mã lỗi</text>
   </g>
   <g id="text_12">
    <g id="patch_32">
     <path d="M 239.927656 275.525156
L 268.072344 275.525156
L 268.072344 264.474844
L 239.927656 264.474844
