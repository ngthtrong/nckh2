" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203b50" x="254" y="272.483437" transform="rotate(-0 254 272.483437)">Đã có</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(106.014414 348.17093)">Thao tác mới</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(68.952539 360.767633)">Kiểm tra operation và quyền</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(69.751133 373.364336)">Tạo, gộp hoặc đổi trạng thái</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(81.875508 385.218109)">Ghi nghiệp vụ + dedup</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(76.842734 397.071883)">Commit cùng transaction</text>
   </g>
   <g id="text_14">
    <g id="patch_33">
     <path d="M 142.226328 325.525156
L 167.773672 325.525156
L 167.773672 314.474844
L 142.226328 314.474844
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203b50" x="155" y="322.483437" transform="rotate(-0 155 322.483437)">Chưa</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(343.076953 385.414715)">rejected</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(310.729453 397.828098)">Sai nghiệp vụ / quyền</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(115.126992 450.69452)">accepted</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(62.21125 462.548293)">Nghiệp vụ và dedup đã commit</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(319.721797 450.511059)">Rollback message</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(337.762148 461.870832)">retry_later</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(307.7325 474.731754)">Giữ message để thử lại</text>
   </g>
   <g id="text_18">
    <g id="patch_34">
     <path d="M 316.643594 427.525156
L 363.356406 427.525156
L 363.356406 416.474844
L 316.643594 416.474844
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203b50" x="340" y="424.483438" transform="rotate(-0 340 424.483438)">Lỗi server</text>
   </g>
   <g id="text_19">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(105.417891 533.133055)">Xong batch → HTTP 200 với results theo message_id</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(88.401016 546.225539)">Mỗi message có accepted / duplicate / rejected / retry_later</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(10 577.910773)">Hình mô tả JSON sync; multipart và SMS có luồng riêng.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(10 590.063867)">Nét đứt: gom ACK. Lỗi một message không hủy các message khác.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #203b50" transform="translate(10 601.823914)">Cùng ID và hash chỉ cho biết thao tác đã được xử lý, không xác định lý do retry.</text>
   </g>
  </g>
 </g>
