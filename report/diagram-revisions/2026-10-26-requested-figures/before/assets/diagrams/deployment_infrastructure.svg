   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="235" y="38.035312" transform="rotate(-0 235 38.035312)">«device» HOST DOCKER COMPOSE</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(307.308594 91.572422)">«container» be · FastAPI / Uvicorn</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(312.049219 102.850312)">rescue_core; Louvain và ưu tiên</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(305.826562 113.946328)">Mặc định :8000 → container :8000</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(255.649219 184.941484)">«container» dashboard</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(255.34375 195.759375)">Nginx · HTML/JS/Leaflet</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(283.675781 206.577266)">:8080 → :80</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(433.264062 184.941484)">«container» fe</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(421.325 195.759375)">Nginx · Flutter Web</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(439.675781 206.577266)">:8081 → :80</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(302.967969 289.979023)">«volume» be-data → /var/lib/rescue</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(314.510937 300.796914)">SQLite WAL: rescue_reports.db</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(310.175 314.539727)">Ảnh: uploads/; backup: backups/</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(55.038281 92.854336)">«device» Android</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(51.273437 103.672227)">GPS, Camera, Hive</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(30.314062 114.664414)">ONNX / ExecuTorch tại biên</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(38.695312 196.138047)">«device» máy điều phối</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(47.871094 207.415938)">Trình duyệt Web GIS</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(69.70625 218.233828)">HTTP :8080</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(36.810156 299.241719)">«device» trình duyệt thử</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(43.027344 311.960703)">Ứng dụng Flutter Web</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(69.70625 322.778594)">HTTP :8081</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(604.641406 92.941484)">«external system»</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(617.360937 103.759375)">SMS gateway</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(607.936719 114.577266)">/api/sms/inbound</text>
   </g>
