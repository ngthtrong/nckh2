   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="10" y="384.097148" transform="rotate(-0 10 384.097148)">Cổng là giá trị mặc định, có thể cấu hình qua biến môi trường. Volume giữ dữ liệu khi container được tạo lại.</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="10" y="400.867344" transform="rotate(-0 10 400.867344)">SMS cần gateway token; điện thoại thật phải truy cập được backend. Không đồng nhất Flutter Web với suy luận native Android.</text>
   </g>
