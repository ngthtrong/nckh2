   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="264" y="31.742266" transform="rotate(-0 264 31.742266)">2 · THÔNG TIN HIỆN TRƯỜNG</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="508" y="31.263203" transform="rotate(-0 508 31.263203)">3 · LƯU VÀ GỬI</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(68.878867 74.435805)">Mở biểu mẫu báo cáo</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(54.876016 85.807008)">Có thể chọn hoặc chụp ảnh</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(89.943633 142.388008)">Có ảnh và AI</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(88.726445 153.854805)">đã sẵn sàng?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(65.907148 205.62591)">AnalyzeImageUseCase</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(47.242617 215.902906)">MobileNetV3-Large, ONNX/PTE</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(61.050273 226.616902)">Nhãn ngập + confidence</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(69.54832 341.784627)">Không có ảnh / AI lỗi:</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(67.087969 352.498623)">giữ thông tin nhập tay</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(47.6575 363.323576)">Không gán nhãn non_flood giả</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(298.23625 75.064623)">Nhập số mắc kẹt, bị thương</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(294.29375 86.273658)">Nhóm yếu thế; mô tả; liên hệ</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(307.450508 142.731641)">Năm dấu hiệu khẩn cấp</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(299.546953 154.198438)">LR khi sẵn sàng → điểm E_i</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(305.871133 205.484041)">Lấy GPS hoặc nhập vị trí</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(304.032734 216.855244)">Không lấy được: để trống</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(298.351289 227.56924)">Không gán tọa độ mặc định</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(312.70668 347.320381)">Kiểm tra dữ liệu nhập</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(315.108398 357.873916)">Bảo toàn ảnh cục bộ</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(540.237539 74.982908)">Tạo RescueRecord, report ID</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(528.592617 85.259904)">status=processing; synced=false</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(556.492187 143.22115)">Ghi bản ghi + Outbox</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(523.168711 153.498146)">Định danh message/hash/sequence</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(575.322969 272.313203)">deliverRecord</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(538.88082 283.138156)">Gửi thích ứng; ACK metadata</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(551.603398 295.929609)">Ảnh có thể đồng bộ sau</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(561.127148 347.24015)">Hiển thị kết quả gửi</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(538.986211 357.954146)">Chưa ACK: giữ hàng đợi/retry</text>
   </g>
