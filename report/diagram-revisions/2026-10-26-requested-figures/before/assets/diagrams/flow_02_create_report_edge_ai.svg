   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #111111" x="10" y="411.393984" transform="rotate(-0 10 411.393984)">Ảnh và AI hỗ trợ khai báo; dữ liệu thiếu được giữ rõ ràng. E_i được gửi nhưng adapter hiện chưa đọc trực tiếp trường này.</text>
