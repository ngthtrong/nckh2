[project]
name = "flood-rescue-product-similarity-demo"
version = "0.0.0"
description = "Reproducible synthetic study of flood-rescue event clustering"
requires-python = ">=3.12,<3.13"
dependencies = [
  "igraph==1.0.0",
  "leidenalg==0.12.0",
  "matplotlib==3.11.0",
  "networkx==3.6.1",
  "numpy==2.5.1",
  "pandas==3.0.3",
  "python-louvain==0.16",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
]

[tool.demo-environment]
lock-file = "requirements.lock"
python-implementation = "CPython"
python-minor = "3.12"
candidate-runner-requires = ["git", "bubblewrap"]
paper-build-requires = ["xelatex", "bibtex"]

[tool.pytest.ini_options]
testpaths = ["demo/tests"]
pythonpath = [".", "demo", "demo/experiments"]
