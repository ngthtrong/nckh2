name: app
description: "Ứng dụng cứu hộ offline-first: nhận diện ảnh on-device, gửi thích ứng theo mạng, SMS fallback."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # any = resolver tự chọn bản mới nhất tương thích (app nội bộ, không publish)
  connectivity_plus: any
  cross_file: any
  causalontology: ^4.0.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  dio: any
  flutter_image_compress: any
  geolocator: any
  hive_ce: any
  hive_ce_flutter: any
  image_picker: any
  intl: any
  onnxruntime: any
  path_provider: any
  permission_handler: any
  url_launcher: any
  uuid: any
  workmanager: any

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  default-flavor: user
  uses-material-design: true
  assets:
    - assets/labels.json
    - assets/images/
    # PTE runs offline by default; ONNX is downloaded only by an authenticated admin.
    - assets/models/model.pte
    - assets/models/model_manifest.json
    - assets/models/urgency_logistic.json
    # Reusable E2E fixtures for both runs; no server address or benchmark timestamp.
    - assets/benchmarks/mobile/
