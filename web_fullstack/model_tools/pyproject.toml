[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-rescue-model-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "pillow>=11,<13",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest_tmp"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["export_model"]

