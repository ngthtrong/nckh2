# Hệ thống demo cứu hộ lũ: backend + dashboard điều phối + app Flutter bản web.
#
#   docker compose up -d --build          # build và chạy
#   docker compose ps                     # trạng thái + healthcheck
#   docker compose down                   # dừng (giữ dữ liệu trong volume be-data)
#   docker compose down -v                # dừng và xóa dữ liệu
#
# Mặc định nạp 316 báo cáo BÁN TỔNG HỢP (run_001) khi DB còn trống; đặt SEED_RUN= để bỏ.
# Điện thoại Android thật / emulator trỏ SERVER_URL tới cổng BE_PORT của máy chạy Docker.
name: flood-rescue

services:
  be:
    build:
      context: .
      dockerfile: products/docker/be/Dockerfile
    image: flood-rescue/be:local
    environment:
      SEED_RUN: ${SEED_RUN-1}
      SEED_RESET: ${SEED_RESET:-0}
      # Tài khoản quản trị tạo lần đầu khi DB chưa có tài khoản (đổi mật khẩu khi triển khai thật);
      # các điều phối viên khác do quản trị viên tạo trên dashboard.
      RESCUE_ADMIN_USERNAME: ${RESCUE_ADMIN_USERNAME:-admin}
      RESCUE_ADMIN_PASSWORD: ${RESCUE_ADMIN_PASSWORD:-${RESCUE_DASHBOARD_PASSWORD:-cuuho2026}}
      # nginx của dashboard và web app: chỉ tin X-Forwarded-For từ hai container này.
      RESCUE_TRUSTED_PROXIES: ${RESCUE_TRUSTED_PROXIES:-dashboard,fe}
      # Nút "Xóa toàn bộ dữ liệu" chỉ dành cho demo; mặc định tắt.
      RESCUE_ALLOW_WIPE: ${RESCUE_ALLOW_WIPE:-0}
      # Sao lưu DB định kỳ vào volume be-data (/var/lib/rescue/backups); 0 = tắt.
      RESCUE_BACKUP_INTERVAL_MIN: ${RESCUE_BACKUP_INTERVAL_MIN:-60}
      # SMS gateway chuyển tiếp tin SOS tới POST /api/sms/inbound; để trống thì tắt.
      RESCUE_SMS_GATEWAY_TOKEN: ${RESCUE_SMS_GATEWAY_TOKEN:-}
    volumes:
      - be-data:/var/lib/rescue
    ports:
      - "${BE_PORT:-8000}:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: products/docker/dashboard/Dockerfile
    image: flood-rescue/dashboard:local
    environment:
      BACKEND_URL: http://be:8000
    depends_on:
      be:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

  fe:
    build:
      context: .
      dockerfile: products/docker/fe/Dockerfile
      # runtime: build Flutter trong Docker; prebuilt: dùng products/fe/app/build/web đã build sẵn.
      target: ${FE_BUILD_TARGET:-runtime}
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.47.5}
        SERVER_URL: ${FE_SERVER_URL:-}
    image: flood-rescue/fe:local
    environment:
      BACKEND_URL: http://be:8000
    depends_on:
      be:
        condition: service_healthy
    ports:
      - "${FE_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  be-data:
